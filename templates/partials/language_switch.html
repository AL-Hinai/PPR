{% load i18n ui %}{% get_current_language as LANGUAGE_CODE %}
<form method="post" action="{% url 'set_language' %}" class="inline">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if LANGUAGE_CODE == "ar" %}
    <button name="language" value="en" class="inline-flex h-9 items-center gap-1.5 rounded-lg px-2.5 text-sm font-medium {% if dark %}text-brand-100 hover:bg-white/10 hover:text-white{% else %}text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50{% endif %}" lang="en">
      {% icon "language" "size-4" %}EN
    </button>
  {% else %}
    <button name="language" value="ar" class="inline-flex h-9 items-center gap-1.5 rounded-lg px-2.5 text-sm font-medium {% if dark %}text-brand-100 hover:bg-white/10 hover:text-white{% else %}text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50{% endif %}" lang="ar">
      {% icon "language" "size-4" %}عربي
    </button>
  {% endif %}
</form>
