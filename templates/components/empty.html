{% load ui %}<div class="flex flex-col items-center justify-center gap-2 px-6 py-10 text-center">
  <span class="grid size-11 place-items-center rounded-full bg-slate-100 text-slate-400">{% icon icon|default:"folder" %}</span>
  <p class="text-sm font-medium text-slate-700">{{ title }}</p>
  {% if text %}<p class="max-w-sm text-sm text-slate-500">{{ text }}</p>{% endif %}
</div>
